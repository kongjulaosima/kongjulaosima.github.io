<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技术技能</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #fff; overflow-x: hidden; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .content { position: relative; z-index: 1; }
        section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px 24px; }
        .nav-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .nav-logo { font-size: 1.2rem; font-weight: 700; text-decoration: none; background: linear-gradient(135deg, #60a5fa, #a78bfa); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; gap: 24px; list-style: none; }
        .nav-links a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #60a5fa; }
        .section-title { font-size: clamp(1.8rem, 4vw, 2.5rem); margin-bottom: 50px; text-align: center; opacity: 0; transform: translateY(30px); transition: all 0.8s ease; }
        .section-title.visible { opacity: 1; transform: translateY(0); }
        .section-title span { background: linear-gradient(135deg, #60a5fa, #a78bfa); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 20px; max-width: 700px; width: 100%; }
        .skill-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 24px 16px; text-align: center; backdrop-filter: blur(10px); opacity: 0; transform: translateY(20px); transition: all 0.5s ease; cursor: pointer; position: relative; overflow: hidden; }
        .skill-card.visible { opacity: 1; transform: translateY(0); }
        .skill-card:hover { border-color: #60a5fa; transform: translateY(-5px) scale(1.02); box-shadow: 0 8px 30px rgba(96, 165, 250, 0.15); }
        .skill-card .ripple { position: absolute; border-radius: 50%; background: rgba(96, 165, 250, 0.4); transform: scale(0); animation: ripple 0.6s linear; pointer-events: none; }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }
        .skill-icon { font-size: 2.5rem; margin-bottom: 12px; }
        .skill-name { font-size: 0.95rem; color: #e2e8f0; font-weight: 500; }
        footer { text-align: center; padding: 30px; color: #475569; font-size: 0.85rem; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        @media (max-width: 640px) { section { padding: 60px 16px; } .nav-links { display: none; } }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <nav class="nav-bar">
        <a href="index.html" class="nav-logo">✦ Home</a>
        <ul class="nav-links">
            <li><a href="about.html">关于</a></li>
            <li><a href="skills.html" class="active">技能</a></li>
            <li><a href="projects.html">项目</a></li>
            <li><a href="hobbies.html">兴趣爱好</a></li>
            <li><a href="papers.html">大模型论文学习</a></li>
            <li><a href="llm_learn.html">LLM学习</a></li>
            <li><a href="presentation.html">演示文稿</a></li>
            <li><a href="contact.html">联系</a></li>
        </ul>
    </nav>
    <div class="content">
        <section id="skills">
            <h2 class="section-title"><span>技术技能</span></h2>
            <div class="skills-grid">
                <div class="skill-card"><div class="skill-icon">🐍</div><div class="skill-name">Python</div></div>
                <div class="skill-card"><div class="skill-icon">⚡</div><div class="skill-name">FastAPI</div></div>
                <div class="skill-card"><div class="skill-icon">🤖</div><div class="skill-name">LLM</div></div>
                <div class="skill-card"><div class="skill-icon">📚</div><div class="skill-name">RAG</div></div>
                <div class="skill-card"><div class="skill-icon">🧠</div><div class="skill-name">Agent</div></div>
            </div>
        </section>
        <footer>&copy; 2026 个人主页 · Built with ❤️</footer>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let particles = []; let mouseX = -1000; let mouseY = -1000;
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            function createParticles(count) {
                particles = [];
                for (let i = 0; i < count; i++) {
                    particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6, size: Math.random() * 2.5 + 1, alpha: Math.random() * 0.6 + 0.2, hue: Math.random() * 60 + 200 });
                }
            }
            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
                    const dx = mouseX - p.x; const dy = mouseY - p.y; const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) { const force = (150 - dist) / 150 * 0.5; p.vx -= (dx / dist) * force * 0.05; p.vy -= (dy / dist) * force * 0.05; }
                    p.vx += (Math.random() - 0.5) * 0.02; p.vy += (Math.random() - 0.5) * 0.02;
                    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                    if (speed > 1.2) { p.vx = (p.vx / speed) * 1.2; p.vy = (p.vy / speed) * 1.2; }
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${p.hue}, 70%, 65%, ${p.alpha})`; ctx.fill();
                }
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y; const dist = dx * dx + dy * dy;
                        if (dist < 12000) { const alpha = (1 - dist / 12000) * 0.3; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(96, 165, 250, ${alpha})`; ctx.lineWidth = 0.6; ctx.stroke(); }
                    }
                }
                requestAnimationFrame(drawParticles);
            }
            function init() { resize(); createParticles(Math.min(Math.floor(canvas.width * canvas.height / 8000), 120)); drawParticles(); }
            window.addEventListener('resize', () => { resize(); createParticles(Math.min(Math.floor(canvas.width * canvas.height / 8000), 120)); });
            document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
            init();
            const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); }); }, { threshold: 0.15 });
            document.querySelectorAll('.section-title, .skill-card').forEach(el => observer.observe(el));
            document.querySelectorAll('.skill-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left; const y = e.clientY - rect.top;
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple'; ripple.style.left = x + 'px'; ripple.style.top = y + 'px';
                    ripple.style.width = ripple.style.height = '20px';
                    this.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 600);
                });
            });
        })();
    </script>
</body>
</html>
