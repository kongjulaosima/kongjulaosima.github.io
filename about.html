<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow-x: hidden;
        }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .content { position: relative; z-index: 1; }
        section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px 24px; }
        .nav-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: 16px 32px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nav-logo { font-size: 1.2rem; font-weight: 700; text-decoration: none; background: linear-gradient(135deg, #60a5fa, #a78bfa); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; gap: 24px; list-style: none; }
        .nav-links a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #60a5fa; }
        .section-title { font-size: clamp(1.8rem, 4vw, 2.5rem); margin-bottom: 50px; text-align: center; opacity: 0; transform: translateY(30px); transition: all 0.8s ease; }
        .section-title.visible { opacity: 1; transform: translateY(0); }
        .section-title span { background: linear-gradient(135deg, #60a5fa, #a78bfa); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .about-content { max-width: 800px; text-align: center; }
        .about-content p { font-size: 1.1rem; line-height: 1.8; color: #cbd5e1; margin-bottom: 16px; opacity: 0; transform: translateY(20px); transition: all 0.6s ease; }
        .about-content p.visible { opacity: 1; transform: translateY(0); }
        .stats { display: flex; justify-content: center; gap: 60px; margin-top: 50px; flex-wrap: wrap; }
        .stat-item { text-align: center; opacity: 0; transform: translateY(20px); transition: all 0.6s ease; }
        .stat-item.visible { opacity: 1; transform: translateY(0); }
        .stat-number { font-size: 2.5rem; font-weight: 700; color: #60a5fa; }
        .stat-label { color: #94a3b8; margin-top: 8px; font-size: 0.95rem; }
        footer { text-align: center; padding: 30px; color: #475569; font-size: 0.85rem; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 640px) { section { padding: 60px 16px; } .stats { gap: 30px; } .nav-links { display: none; } }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <nav class="nav-bar">
        <a href="index.html" class="nav-logo">✦ Home</a>
        <ul class="nav-links">
            <li><a href="about.html" class="active">关于</a></li>
            <li><a href="skills.html">技能</a></li>
            <li><a href="projects.html">项目</a></li>
            <li><a href="hobbies.html">兴趣爱好</a></li>
            <li><a href="papers.html">大模型论文学习</a></li>
            <li><a href="llm_learn.html">LLM学习</a></li>
            <li><a href="presentation.html">演示文稿</a></li>
            <li><a href="contact.html">联系</a></li>
        </ul>
    </nav>
    <div class="content">
        <section id="about">
            <h2 class="section-title"><span>关于我</span></h2>
            <div class="about-content">
                <p>我是一名充满热情的全栈开发者，拥有丰富的 Web 应用开发和深度学习经验。</p>
                <p>我相信技术的力量可以改变世界，始终保持好奇心和学习热情，探索前沿技术并应用于实际项目。</p>
                <p>在工作之余，我喜欢参与开源项目、撰写技术博客，以及在各种编程社区中分享知识。</p>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-number">5+</div>
                        <div class="stat-label">项目经验</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">3+</div>
                        <div class="stat-label">技术方向</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">∞</div>
                        <div class="stat-label">学习热情</div>
                    </div>
                </div>
            </div>
        </section>
        <footer>&copy; 2026 个人主页 · Built with ❤️</footer>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let particles = []; let mouseX = -1000; let mouseY = -1000;
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            function createParticles(count) {
                particles = [];
                for (let i = 0; i < count; i++) {
                    particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6, size: Math.random() * 2.5 + 1, alpha: Math.random() * 0.6 + 0.2, hue: Math.random() * 60 + 200 });
                }
            }
            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
                    const dx = mouseX - p.x; const dy = mouseY - p.y; const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) { const force = (150 - dist) / 150 * 0.5; p.vx -= (dx / dist) * force * 0.05; p.vy -= (dy / dist) * force * 0.05; }
                    p.vx += (Math.random() - 0.5) * 0.02; p.vy += (Math.random() - 0.5) * 0.02;
                    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                    if (speed > 1.2) { p.vx = (p.vx / speed) * 1.2; p.vy = (p.vy / speed) * 1.2; }
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${p.hue}, 70%, 65%, ${p.alpha})`; ctx.fill();
                }
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y; const dist = dx * dx + dy * dy;
                        if (dist < 12000) { const alpha = (1 - dist / 12000) * 0.3; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(96, 165, 250, ${alpha})`; ctx.lineWidth = 0.6; ctx.stroke(); }
                    }
                }
                requestAnimationFrame(drawParticles);
            }
            function init() { resize(); createParticles(Math.min(Math.floor(canvas.width * canvas.height / 8000), 120)); drawParticles(); }
            window.addEventListener('resize', () => { resize(); createParticles(Math.min(Math.floor(canvas.width * canvas.height / 8000), 120)); });
            document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
            init();
            const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); }); }, { threshold: 0.15 });
            document.querySelectorAll('.section-title, .about-content p, .stat-item').forEach(el => observer.observe(el));
        })();
    </script>
</body>
</html>
